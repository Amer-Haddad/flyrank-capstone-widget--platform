run: npm run dev
seed: "No seed command; use npm run migrate to apply the schema"
test: npm test
base_url: http://localhost:3000
probes:
  - command: npm test
    description: Run the complete automated acceptance suite
  - command: npm run serve:admin
    description: Serve the admin interface on port 5500
endpoints:
  - method: GET
    path: /api/health
    description: Service health baseline endpoint
  - method: POST
    path: /api/auth/register
    description: Create a tenant and its first owner account
  - method: GET
    path: /widget.js?id=11111111-1111-4111-8111-111111111111&v=7
    description: Versioned public widget bundle with immutable caching
  - method: GET
    path: /api/public/widgets/11111111-1111-4111-8111-111111111111/config
    description: Public widget configuration with short-lived caching
  - method: OPTIONS
    path: /api/public/submissions
    description: Public submission CORS preflight
  - method: POST
    path: /api/public/submissions
    description: Validated and rate-limited public submission endpoint
  - method: POST
    path: /api/widgets
    description: Authenticated tenant-scoped widget creation
  - method: GET
    path: /api/widgets
    description: Authenticated tenant-scoped widget listing
  - method: PATCH
    path: /api/widgets/11111111-1111-4111-8111-111111111111
    description: Authenticated tenant-scoped widget update
  - method: DELETE
    path: /api/widgets/11111111-1111-4111-8111-111111111111
    description: Authenticated tenant-scoped widget deletion
  - method: GET
    path: /api/dashboard/submissions?page=1&pageSize=25
    description: Authenticated tenant-scoped dashboard submissions
  - method: GET
    path: /api/dashboard/stats/overview
    description: Authenticated tenant-scoped dashboard overview analytics
  - method: GET
    path: /api/dashboard/stats/widgets
    description: Authenticated tenant-scoped widget analytics
  - method: GET
    path: /api/dashboard/stats/geo
    description: Authenticated tenant-scoped geo analytics